name: TestFlight

# Deliberately not on every push: a macOS runner minute counts tenfold on
# private repositories, and every upload burns a build number in TestFlight.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed in this build (shown to testers)"
        required: false
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive & upload
    runs-on: macos-latest

    env:
      SCHEME: DosiCrew
      PROJECT: DosiCrew.xcodeproj

    steps:
      - uses: actions/checkout@v4

      - name: Check that the signing secrets are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            # Plain `if`, not `[ ... ] && ...`: the runner uses `bash -e`, where
            # an AND-list returning 1 aborts the step — which would happen here
            # precisely when the secret *is* set.
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "See the 'Auf das iPhone' section of README.md for where each value comes from."
            exit 1
          fi
          # The private key may arrive either way: pasted straight out of the
          # .p8 file, or base64 encoded. Encoding it is awkward without a Mac,
          # so neither form is required — one of them is.
          if [ -z "$ASC_KEY_P8" ] && [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::error::The private key is missing. Set either ASC_KEY_P8 (the contents of the .p8 file, including the BEGIN and END lines) or ASC_KEY_P8_BASE64 (the same file, base64 encoded). One of the two is enough."
            exit 1
          fi
          echo "Signing secrets are set."

      - name: Select the newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # Both xcodebuild and altool read the key from this directory.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"

          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_FILE"
            echo "Using ASC_KEY_P8 (raw key contents)."
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_FILE"
            echo "Using ASC_KEY_P8_BASE64 (decoded)."
          fi
          chmod 600 "$KEY_FILE"

          # Catch a half-copied paste, a value in the wrong secret, or an
          # encoding that ate the line breaks — all of which would otherwise
          # only surface later as an opaque signing error. Only the verdict is
          # printed; the key itself never reaches the log.
          if ! head -n 1 "$KEY_FILE" | grep -q -- "-----BEGIN PRIVATE KEY-----"; then
            echo "::error::The installed key does not start with '-----BEGIN PRIVATE KEY-----'. Check that ASC_KEY_P8 holds the complete contents of the .p8 file (BEGIN and END lines included), or that ASC_KEY_P8_BASE64 is the base64 of that file."
            exit 1
          fi
          echo "Private key looks well formed."

          echo "ASC_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Check that the key actually works
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Seconds instead of the five minutes an archive takes: if key,
          # issuer and team do not belong together, fail here rather than at
          # the signing step with a message that looks like something else.
          if ! xcrun altool --list-apps --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"; then
            echo "::error::The App Store Connect key was rejected. Check ASC_KEY_ID, ASC_ISSUER_ID and that the key has the App Manager role."
            exit 1
          fi

      - name: Prepare export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" Tools/ExportOptions.plist > build/ExportOptions.plist
          plutil -lint build/ExportOptions.plist

      - name: Archive (signed for distribution)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # Signed here, not only at export — and specifically for
          # *distribution*.
          #
          # This step used to pass CODE_SIGNING_ALLOWED=NO, to dodge the fact
          # that automatic signing reaches for an *iOS App Development* profile,
          # and those need a registered device that a fresh team does not have.
          # It dodged something else too: without signing, no entitlements are
          # embedded, and `exportArchive` has none to carry over. It then signs
          # with the bare minimum the profile brings — application-identifier,
          # team-identifier, beta-reports-active, get-task-allow — and the app
          # ships with no iCloud container, no CloudKit and no time-sensitive
          # notifications. That is what made Build 6 trap on launch.
          #
          # Naming Apple Distribution sends automatic signing to the App Store
          # profile instead of the development one, so the device problem does
          # not arise and the entitlements are embedded from the start.
          #
          # TestFlight rejects a build number it has already seen, so it comes
          # from the run counter rather than the checked-in value.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DosiCrew.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Check the archive carries its entitlements
        run: |
          # Checked here as well as after the export, because these two steps
          # fail for different reasons and the distinction is the whole
          # diagnosis: missing here means the archive never had them; missing
          # only after the export means the profile dropped them.
          APP=$(find build/DosiCrew.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$APP" ] || { echo "::error::No .app inside the archive."; exit 1; }
          codesign -d --entitlements :- "$APP" > archive-entitlements.plist 2>/dev/null || true
          cat archive-entitlements.plist
          if ! grep -q "iCloud.es.reichenbach.DosiCrew" archive-entitlements.plist; then
            echo "::error::The archived app carries no iCloud container entitlement. Signing during the archive step is what embeds them; check CODE_SIGN_IDENTITY and CODE_SIGN_STYLE above."
            exit 1
          fi
          echo "The archive carries its entitlements."

      - name: Export and sign the IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # This is where signing happens: -allowProvisioningUpdates creates
          # the App Store distribution profile and certificate, neither of
          # which needs a registered device.
          set +e
          xcodebuild -exportArchive \
            -archivePath build/DosiCrew.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          set -e

          # This one is worth naming outright: the message says nothing about
          # roles, and the obvious reading — "the profile is missing" — sends
          # you looking in the wrong place.
          if grep -q "Cloud signing permission error" export.log; then
            echo "::error::The App Store Connect key may not create distribution certificates. Cloud signing needs a key with the *Admin* role; App Manager is not enough. Create a new Team Key with Admin access and update ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          ls -lh build/export

      - name: Check the signed entitlements
        run: |
          # Build 6 exported cleanly and then trapped on launch inside
          # -[CKContainerImplementation _checkRequiredEntitlements]: the IPA had
          # no iCloud container environment. Nothing before this point noticed,
          # because a missing export option is not an export error.
          #
          # So the built artefact is asked what it actually carries, rather than
          # the source being trusted to describe it.
          APP=$(find build/export -maxdepth 3 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            # Only the .ipa is produced for some export methods; unpack it.
            IPA=$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)
            [ -n "$IPA" ] || { echo "::error::Neither an .app nor an .ipa in build/export."; exit 1; }
            rm -rf build/unpacked && mkdir -p build/unpacked
            unzip -q "$IPA" -d build/unpacked
            APP=$(find build/unpacked/Payload -maxdepth 1 -name '*.app' -print -quit)
          fi
          echo "Checking $APP"
          codesign -d --entitlements :- "$APP" > entitlements.plist 2>/dev/null
          cat entitlements.plist

          missing=""
          grep -q "iCloud.es.reichenbach.DosiCrew" entitlements.plist || missing="$missing container-identifier"
          grep -q "com.apple.developer.icloud-container-environment" entitlements.plist || missing="$missing container-environment"
          grep -q "com.apple.developer.usernotifications.time-sensitive" entitlements.plist || missing="$missing time-sensitive"
          if [ -n "$missing" ]; then
            echo "::error::The signed app is missing:$missing. Check Tools/ExportOptions.plist and the capabilities on the App ID. Uploading now would produce a build that crashes on launch."
            exit 1
          fi
          echo "Entitlements look complete."

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove the API key from the runner
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/"*.p8

      - name: Keep the archive for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Archive
          path: |
            build/export/*.ipa
            build/DosiCrew.xcarchive/Info.plist
          retention-days: 7
          if-no-files-found: ignore
