name: TestFlight

# Deliberately not on every push: a macOS runner minute counts tenfold on
# private repositories, and every upload burns a build number in TestFlight.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed in this build (shown to testers)"
        required: false
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive & upload
    runs-on: macos-latest

    env:
      SCHEME: DosiCrew
      PROJECT: DosiCrew.xcodeproj

    steps:
      - uses: actions/checkout@v4

      - name: Check that the signing secrets are present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            # Plain `if`, not `[ ... ] && ...`: the runner uses `bash -e`, where
            # an AND-list returning 1 aborts the step — which would happen here
            # precisely when the secret *is* set.
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "See the 'Auf das iPhone' section of README.md for where each value comes from."
            exit 1
          fi
          # The private key may arrive either way: pasted straight out of the
          # .p8 file, or base64 encoded. Encoding it is awkward without a Mac,
          # so neither form is required — one of them is.
          if [ -z "$ASC_KEY_P8" ] && [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::error::The private key is missing. Set either ASC_KEY_P8 (the contents of the .p8 file, including the BEGIN and END lines) or ASC_KEY_P8_BASE64 (the same file, base64 encoded). One of the two is enough."
            exit 1
          fi
          # The distribution certificate. Runs 12 and 13 established why it has
          # to be supplied rather than created on the runner: cloud signing
          # issues the certificate but keeps its private key at Apple, so
          # `security find-identity` reports "0 valid identities found" no
          # matter which keychain it searches — and an archive cannot be signed
          # with a key that is not there.
          if [ -z "$DIST_CERT_P12_BASE64" ] || [ -z "$DIST_CERT_PASSWORD" ]; then
            echo "::error::The distribution certificate is missing. Set DIST_CERT_P12_BASE64 (the .p12 file, base64 encoded) and DIST_CERT_PASSWORD (the password it was exported with). See the 'Zertifikat hinterlegen' section of README.md for how to make one without a Mac."
            exit 1
          fi
          echo "Signing secrets are set."

      - name: Select the newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          # Both xcodebuild and altool read the key from this directory.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"

          if [ -n "$ASC_KEY_P8" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_FILE"
            echo "Using ASC_KEY_P8 (raw key contents)."
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_FILE"
            echo "Using ASC_KEY_P8_BASE64 (decoded)."
          fi
          chmod 600 "$KEY_FILE"

          # Catch a half-copied paste, a value in the wrong secret, or an
          # encoding that ate the line breaks — all of which would otherwise
          # only surface later as an opaque signing error. Only the verdict is
          # printed; the key itself never reaches the log.
          if ! head -n 1 "$KEY_FILE" | grep -q -- "-----BEGIN PRIVATE KEY-----"; then
            echo "::error::The installed key does not start with '-----BEGIN PRIVATE KEY-----'. Check that ASC_KEY_P8 holds the complete contents of the .p8 file (BEGIN and END lines included), or that ASC_KEY_P8_BASE64 is the base64 of that file."
            exit 1
          fi
          echo "Private key looks well formed."

          echo "ASC_KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Check that the key actually works
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Seconds instead of the five minutes an archive takes: if key,
          # issuer and team do not belong together, fail here rather than at
          # the signing step with a message that looks like something else.
          if ! xcrun altool --list-apps --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"; then
            echo "::error::The App Store Connect key was rejected. Check ASC_KEY_ID, ASC_ISSUER_ID and that the key has the App Manager role."
            exit 1
          fi

      - name: Install the distribution certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          # Why the certificate is carried in rather than made here:
          #
          # Cloud signing (-allowProvisioningUpdates) does issue a distribution
          # certificate, and the export step has used it happily since run 4.
          # But it keeps the private key at Apple. Run 12 looked for it and
          # found nothing; run 13 gave the runner a fresh, unlocked keychain,
          # put it first in the search list, and still got:
          #
          #   0 identities found
          #
          # That settles it. Nothing on the runner can sign locally unless a
          # real certificate with its private key is brought along — and the
          # archive has to be signed locally, because that is the only moment
          # the entitlements get written into the binary.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          P12="$RUNNER_TEMP/distribution.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Without this the keychain re-locks after five minutes of idling and
          # the archive fails in the middle on a password prompt nobody can
          # answer.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # First in the search list and the default one; the runner's existing
          # keychains stay in the list so nothing else breaks.
          EXISTING=$(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          security default-keychain -s "$KEYCHAIN"

          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$P12"
          if [ ! -s "$P12" ]; then
            echo "::error::DIST_CERT_P12_BASE64 did not decode to anything. It must be the base64 of the .p12 file, on one line."
            exit 1
          fi

          if ! security import "$P12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
                 -T /usr/bin/codesign -T /usr/bin/security -A 2>import.log; then
            cat import.log
            echo "::error::The certificate could not be imported. Two usual causes: DIST_CERT_PASSWORD does not match the password the .p12 was exported with, or the .p12 was written by OpenSSL 3 without -legacy, whose encryption macOS cannot read. README.md gives the exact openssl command."
            exit 1
          fi
          rm -f "$P12"

          # Without this, codesign stops and asks for the keychain password the
          # first time it uses the key — which on a runner means hanging until
          # the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          echo "--- code signing identities ---"
          security find-identity -v -p codesigning
          IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::The .p12 imported, but it holds no Apple Distribution identity. Check that the certificate downloaded from the portal was of type 'Apple Distribution' and that the .p12 was built from it together with its private key."
            exit 1
          fi
          echo "Identity: $IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" Tools/ExportOptions.plist > build/ExportOptions.plist
          plutil -lint build/ExportOptions.plist

      - name: Archive (unsigned, to get something to export)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Unsigned, because every way of signing at this point is closed:
          #
          #   * automatic signing reaches for an iOS App Development profile,
          #     and those want a registered device that a fresh team has none
          #     of (run 3);
          #   * automatic signing plus CODE_SIGN_IDENTITY="Apple Distribution"
          #     is rejected as conflicting settings (run 9);
          #   * ad-hoc signing is refused by the SDK — "Ad Hoc code signing is
          #     not allowed with SDK 'iOS 26.5'" (run 10).
          #
          # The way out is the one thing that has worked since run 4: cloud
          # signing at export time, which needs no device. It only needs an
          # archive to work on — so this is that archive, and its own export is
          # thrown away. What it leaves behind is the point: the App Store
          # provisioning profile, on disk, where the second archive can name it.
          #
          # TestFlight rejects a build number it has already seen, so it comes
          # from the run counter rather than the checked-in value.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/pass1.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Fetch the App Store profile by way of a throwaway export
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # This export is discarded. Runs 6 to 11 proved it cannot produce a
          # usable app — an unsigned archive carries no entitlements, and
          # exportArchive does not read them from anywhere else, so it signs
          # with the four lines the profile brings on its own. That is the app
          # Build 6 was, and it trapped on launch.
          #
          # What it does do is make Apple issue the App Store profile for this
          # bundle identifier and put it where the next archive can name it.
          # The certificate is already in the keychain by now, from the secret.
          set +e
          xcodebuild -exportArchive \
            -archivePath build/pass1.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/pass1 \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export1.log
          status=${PIPESTATUS[0]}
          set -e

          # Worth naming outright: the message says nothing about roles, and
          # the obvious reading — "the profile is missing" — sends you looking
          # in the wrong place.
          if grep -q "Cloud signing permission error" export1.log; then
            echo "::error::The App Store Connect key may not create distribution certificates. Cloud signing needs a key with the *Admin* role; App Manager is not enough. Create a new Team Key with Admin access and update ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8."
            exit 1
          fi
          [ "$status" -eq 0 ] || exit "$status"

          # The profile is taken out of the exported app rather than searched
          # for on disk: this is by definition the one Apple just picked for
          # this bundle identifier, so there is nothing to guess and no second
          # profile to confuse it with.
          IPA=$(ls build/pass1/*.ipa | head -1)
          rm -rf build/pass1-unpacked && mkdir -p build/pass1-unpacked
          unzip -q "$IPA" -d build/pass1-unpacked
          APP=$(find build/pass1-unpacked/Payload -maxdepth 1 -name '*.app' -print -quit)
          PROFILE="$APP/embedded.mobileprovision"
          [ -f "$PROFILE" ] || { echo "::error::The exported app has no embedded profile."; exit 1; }

          security cms -D -i "$PROFILE" > build/profile.plist
          UUID=$(plutil -extract UUID raw -o - build/profile.plist)
          NAME=$(plutil -extract Name raw -o - build/profile.plist)
          echo "Profile: $NAME ($UUID)"
          echo "It allows:"
          plutil -extract Entitlements xml1 -o - build/profile.plist

          # Xcode looks here when a build names a profile.
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          cp "$PROFILE" "$DEST/$UUID.mobileprovision"

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Archive again, signed with that profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # The archive that actually ships. Manual signing is what makes
          # naming a distribution identity legal — under automatic signing the
          # same setting is a conflict (run 9) — and the profile now exists, so
          # the objection that closed this door in run 3 no longer applies.
          #
          # Xcode writes the full entitlements into the binary here: the iCloud
          # container, CloudKit, time-sensitive notifications, and the
          # application-identifier the profile prescribes. That is the whole
          # point of the second pass.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DosiCrew.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

      - name: Check the archive carries its entitlements
        run: |
          # Checked here as well as after the export, because the two fail for
          # different reasons and the difference is the diagnosis: missing here
          # means the second archive did not embed them; missing only after the
          # export means the export dropped them again.
          APP=$(find build/DosiCrew.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$APP" ] || { echo "::error::No .app inside the archive."; exit 1; }
          codesign -d --entitlements :- "$APP" > archive-entitlements.plist 2>/dev/null || true
          cat archive-entitlements.plist
          if [ ! -s archive-entitlements.plist ]; then
            echo "::error::The archived app is not signed, so it carries no entitlements. Check CODE_SIGN_IDENTITY and PROVISIONING_PROFILE_SPECIFIER in the step above."
            exit 1
          fi
          if ! grep -q "iCloud.es.reichenbach.DosiCrew" archive-entitlements.plist; then
            echo "::error::The archived app is signed but carries no iCloud container, so CODE_SIGN_ENTITLEMENTS did not reach it. Check that the Release configuration still points at Config/DosiCrew.Release.entitlements."
            exit 1
          fi
          echo "The archive carries its entitlements."

      - name: Export and sign the IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # Re-signs the already-signed archive for the store and adds
          # iCloudContainerEnvironment from the export options. The profile and
          # the certificate exist by now, so this is the cheap pass.
          set +e
          xcodebuild -exportArchive \
            -archivePath build/DosiCrew.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log
          status=${PIPESTATUS[0]}
          set -e

          # This one is worth naming outright: the message says nothing about
          # roles, and the obvious reading — "the profile is missing" — sends
          # you looking in the wrong place.
          if grep -q "Cloud signing permission error" export.log; then
            echo "::error::The App Store Connect key may not create distribution certificates. Cloud signing needs a key with the *Admin* role; App Manager is not enough. Create a new Team Key with Admin access and update ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          ls -lh build/export

      - name: Check the signed entitlements
        run: |
          # Build 6 exported cleanly and then trapped on launch inside
          # -[CKContainerImplementation _checkRequiredEntitlements]: the IPA had
          # no iCloud container environment. Nothing before this point noticed,
          # because a missing export option is not an export error.
          #
          # So the built artefact is asked what it actually carries, rather than
          # the source being trusted to describe it.
          APP=$(find build/export -maxdepth 3 -name '*.app' -print -quit)
          if [ -z "$APP" ]; then
            # Only the .ipa is produced for some export methods; unpack it.
            IPA=$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)
            [ -n "$IPA" ] || { echo "::error::Neither an .app nor an .ipa in build/export."; exit 1; }
            rm -rf build/unpacked && mkdir -p build/unpacked
            unzip -q "$IPA" -d build/unpacked
            APP=$(find build/unpacked/Payload -maxdepth 1 -name '*.app' -print -quit)
          fi
          echo "Checking $APP"
          codesign -d --entitlements :- "$APP" > entitlements.plist 2>/dev/null
          cat entitlements.plist

          missing=""
          grep -q "iCloud.es.reichenbach.DosiCrew" entitlements.plist || missing="$missing container-identifier"
          grep -q "com.apple.developer.icloud-container-environment" entitlements.plist || missing="$missing container-environment"
          grep -q "com.apple.developer.usernotifications.time-sensitive" entitlements.plist || missing="$missing time-sensitive"
          if [ -n "$missing" ]; then
            # The archive was checked a few steps ago, so if something is gone
            # now the profile dropped it — and the profile says why. Printing it
            # turns "missing" into "the App ID has no such capability".
            PROFILE="$APP/embedded.mobileprovision"
            if [ -f "$PROFILE" ]; then
              echo "--- entitlements the embedded profile allows ---"
              security cms -D -i "$PROFILE" 2>/dev/null | plutil -extract Entitlements xml1 -o - - || true
            fi
            echo "::error::The signed app is missing:$missing. The archive had them, so the App Store profile dropped them — the App ID needs the matching capabilities (iCloud with CloudKit, Push, Time Sensitive Notifications) in the Developer portal. Uploading now would produce a build that crashes on launch."
            exit 1
          fi
          echo "Entitlements look complete."

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove the API key from the runner
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/"*.p8

      - name: Keep the archive for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Archive
          path: |
            build/export/*.ipa
            build/DosiCrew.xcarchive/Info.plist
          retention-days: 7
          if-no-files-found: ignore
