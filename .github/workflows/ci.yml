name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: iOS Simulator
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          # The project uses Xcode 16 folder synchronisation (objectVersion 77),
          # so the runner's default Xcode is not necessarily new enough.
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 .github/scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project DosiCrew.xcodeproj \
            -scheme DosiCrew \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
