name: DosiCrew
options:
  bundleIdPrefix: es.reichenbach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  DosiCrew:
    type: application
    platform: iOS
    sources:
      - path: DosiCrew
    settings:
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/DosiCrew.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/DosiCrew.Release.entitlements
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.reichenbach.DosiCrew
        PRODUCT_NAME: DosiCrew
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  DosiCrewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DosiCrewTests
    dependencies:
      - target: DosiCrew
    settings:
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/DosiCrew.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/DosiCrew.Release.entitlements
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.reichenbach.DosiCrewTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DosiCrew:
    build:
      targets:
        DosiCrew: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DosiCrewTests
